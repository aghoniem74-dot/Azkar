<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسبحة الأذكار</title>
<style>
:root{color-scheme:dark;--bg:#0b1f1a;--card:#12332b;--gold:#e8c468;--tx:#f3efe0;--mut:#8fb3a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0,#17463b,var(--bg) 70%);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;overflow:hidden}
.w{max-width:480px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px;height:100%}
#main{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.tabs{flex:none;display:flex;background:var(--card);border-radius:30px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:26px;font-size:16px;font-family:inherit}
.tabs button.on{background:var(--gold);color:#143;font-weight:700}
.bar{flex:none;height:6px;background:var(--card);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.txt{flex:1 1 0;min-height:0;background:var(--card);border:1px solid #1f5446;border-radius:18px;padding:14px;font-size:21px;line-height:1.75;text-align:center;display:flex;align-items:safe center;justify-content:safe center;overflow:hidden}
.fz{flex:none;height:76px;background:#0f2a24;border-right:3px solid var(--gold);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.6;color:#cfe3da;overflow:hidden}
.meta{flex:none;display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.ring{position:relative;width:130px;height:130px;flex:none;margin:0 auto;touch-action:manipulation}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.bg{stroke:#1d4a3f}.fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .2s}
#tap{position:absolute;inset:16px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#2a7a65,#14463a);color:var(--tx);font-size:34px;font-weight:700;box-shadow:0 8px 24px #0008,inset 0 2px 6px #fff3;overflow:hidden;font-family:inherit}
#tap:active{transform:scale(.95)}
#tap span{font-size:13px;display:block;color:var(--gold);font-weight:400}
.rp{position:absolute;border-radius:50%;background:#e8c46855;transform:scale(0);animation:r .5s ease-out forwards;pointer-events:none}
@keyframes r{to{transform:scale(4);opacity:0}}
.row{flex:none;display:flex;flex-wrap:nowrap;gap:8px;justify-content:center}
.row button{background:var(--card);color:var(--tx);border:1px solid #1f5446;border-radius:14px;padding:8px 16px;font-size:18px;font-family:inherit}
.row button.off{opacity:.45}
.done{display:none;text-align:center;padding:30px 10px}
.done h2{color:var(--gold);font-size:28px}
</style>
</head>
<body>
<div class="w">
  <div class="tabs"><button id="tm" onclick="setMode('m')">☀️ الصباح</button><button id="te" onclick="setMode('e')">🌙 المساء</button></div>
  <div class="bar"><i id="pb"></i></div>
  <div id="main">
    <div class="txt" id="txt"></div>
    <div class="meta"><span id="idx"></span><span id="rep"></span></div>
    <div class="ring">
      <svg viewBox="0 0 210 210"><circle class="bg" cx="105" cy="105" r="98"/><circle class="fg" id="fg" cx="105" cy="105" r="98" stroke-dasharray="615.8" stroke-dashoffset="615.8"/></svg>
      <button id="tap" onclick="tap(event)"><div id="cnt">0</div><span>المتبقي <b id="left"></b></span></button>
    </div>
    <div class="row" style="direction:ltr"><button onclick="skip()">⏭</button><button onclick="prev()">⏮</button><button onclick="resetAll()">↺</button><button id="bv" onclick="tg('v')">📳</button><button id="bs" onclick="tg('s')">🔊</button></div>
    <div class="fz" id="fz"></div>
  </div>
  <div class="done" id="done"><div style="font-size:64px">🌿</div><h2>تقبل الله منك</h2><p>أتممت الأذكار، جعلها الله في ميزان حسناتك</p><div class="row"><button onclick="resetAll()">ابدأ من جديد</button></div></div>
</div>

["اللهم إني {c} أشهدك، وأشهد حملة عرشك، وملائكتك، وجميع خلقك، أنك أنت الله لا إله إلا أنت وحدك لا شريك لك، وأن محمدا عبدك ورسولك",4],
["اللهم ما {b} بي من نعمة أو بأحد من خلقك، فمنك وحدك لا شريك لك، فلك الحمد ولك الشكر",1],
[["اللهم بك أصبحنا وبك أمسينا، وبك نحيا وبك نموت وإليك النشور","اللهم بك أمسينا وبك أصبحنا، وبك نحيا وبك نموت وإليك المصير"],1],
["{a} على فطرة الإسلام، وعلى كلمة الإخلاص، وعلى دين نبينا محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم حنيفا مسلما وما كان من المشركين",1],

["اللهم إني أسألك العفو والعافية في الدنيا والآخرة، اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي، اللهم استر عوراتي وآمن روعاتي، اللهم احفظني من بين يدي ومن خلفي وعن يميني وعن شمالي، ومن فوقي، وأعوذ بعظمتك أن أغتال من تحتي",1],

var FZ=[
"من قالها ثلاثًا حين يصبح وثلاثًا حين يمسي لم تصبه فجأة بلاء. (رواه أبو داود والترمذي)",

"داخلة في حديث المعوذات: تكفيه من كل شيء إذا قرأها ثلاثًا صباحًا ومساءً. (رواه أبو داود والترمذي)",
"من قالها سبع مرات صباحًا ومساءً كفاه الله ما أهمّه من أمر الدنيا والآخرة. (رواه أبو داود موقوفًا على أبي الدرداء)",
"من قالها ثلاثًا حين يمسي لم تضره حُمَة تلك الليلة. (رواه أحمد والترمذي)",
"من صلى على النبي ﷺ صلاة صلى الله عليه بها عشرًا. (رواه مسلم)",
"قال النبي ﷺ لجويرية رضي الله عنها: لقد قلتُ بعدك أربع كلمات ثلاث مرات لو وُزنت بما قلتِ منذ اليوم لوزنتهن. (رواه مسلم)",

"كان النبي ﷺ يقولها إذا أصبح (وفي المساء بصيغتها المقابلة). (رواه الترمذي)",

var V={m:{a:"أصبحنا",b:"أصبح",c:"أصبحت",y:"هذا اليوم",z:"بعده",f:"فيه",q:"فتحه، ونصره، ونوره وبركته، وهداه"},e:{a:"أمسينا",b:"أمسى",c:"أمسيت",y:"هذه الليلة",z:"بعدها",f:"فيها",q:"فتحها، ونصرها، ونورها وبركتها، وهداها"}};
function LST(){return I.filter(function(x){return !(x[2]&&mode=="m")})}
function fx(s){if(typeof s!="string")s=s[mode=="m"?0:1];return s.replace(/\{(\w)\}/g,function(_,k){return V[mode][k]})}

function render(){
  var L=LST();
  $("tm").className=mode=="m"?"on":"";$("te").className=mode=="e"?"on":"";
  if(i>=L.length){$("main").style.display="none";$("done").style.display="block";$("pb").style.width="100%";return}

}
function beep(f,t){
  if(!snd)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="sine";
    g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+t)}catch(e){}
}
function buzz(p){if(vib&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}
function tap(ev){
